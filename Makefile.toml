[tasks.default]
alias = "ci"
dependencies = [
  "fmt",
  "clippy",
  "check",
  "test",
  "readme",
  "build",
]

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

# Keep the feature sets in sync with `featureMatrix` in flake.nix.
[tasks.clippy]
clear = true
script = '''
set -e
for features in \
  "" \
  "--no-default-features --features image-defaults,crossterm" \
  "--no-default-features --features chafa-static,image-defaults,crossterm" \
  "--features serde,tokio,chafa-dyn" \
  "--features thread-example"
do
  echo "clippy: ${features:-default}"
  cargo clippy $features --all-targets -- --deny warnings
done
'''

[tasks.check]
command = "cargo"
args = ["check", "--all-features"]

[tasks.test]
command = "cargo"
args = ["test", "--features", "crossterm"]

[tasks.readme]
command = "cargo"
args = ["readme", "-o", "README.md"]

[tasks.build]
command = "cargo"
args = ["build", "--features", "crossterm"]

