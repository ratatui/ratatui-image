name: Release-plz release

on:
  push:
    branches:
      - master

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'ratatui' }}
    permissions:
      actions: read
    steps:
      - name: Wait for CI to pass
        run: |
          echo "Waiting for CI on ${{ github.sha }}..."
          for i in $(seq 1 60); do
            conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yaml/runs" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${{ github.sha }}\")] | .[0].conclusion // \"pending\"")
            echo "CI conclusion: $conclusion"
            if [ "$conclusion" = "success" ]; then exit 0; fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "CI did not pass"
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for CI"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    needs: wait-for-ci
    environment: release
    if: ${{ github.repository_owner == 'ratatui' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
