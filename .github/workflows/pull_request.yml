name: pull-request
on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  check-fast-forward:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # We appear to need write permission for both pull-requests and
      # issues in order to post a comment to a pull request.
      pull-requests: write
      issues: write

    steps:
      - name: Checking if fast forwarding is possible
        uses: sequoia-pgp/fast-forward@v1
        with:
          merge: false
          # To reduce the workflow's verbosity, use 'on-error'
          # to only post a comment when an error occurs, or 'never' to
          # never post a comment.  (In all cases the information is
          # still available in the step's summary.)
          comment: never

  check-no-claude-coauthor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No claude spam
        run: |
          if git log ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --format="%B" \
            | grep -qi "^Co-Authored-By: Claude"; then
            echo "Error: PR contains commits with \"^Co-authored-By: Claude\""
            echo "To disable: set coAuthorWithClaude: false in ~/.claude/settings.json, or Settings -> Features -> disable 'Add Claude co-authorship to commit messages'."
            echo "Or just edit these commits and remove the spam."
            exit 1
          fi
      - name: No claude session trailer
        run: |
          if git log ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --format="%B" \
            | grep -qi "^Claude-Session:"; then
            echo "Error: PR contains commits with \"^Claude-Session:\""
            echo "Edit these commits and remove these links, which become 404 anyway."
            exit 1
          fi
